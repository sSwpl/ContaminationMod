plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.28-beta'
}

version = '1.0.1'
group = 'com.example.contamination'
base {
    archivesName = 'contamination'
}

ext {
    mc_version = '1.21.1'
    neoforge_version = '21.1.72'  // NeoForge for 1.21.1
    jei_version = '19.25.0.324'   // JEI for 1.21.1
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neoforge_version
    
    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
            programArguments.addAll '--mod', 'contamination', '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
    }
    
    mods {
        contamination {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    // JEI main maven
    maven { url = 'https://maven.blamejared.com' }
}

dependencies {
    // JEI 1.21.1
    compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version: mc_version,
            neoforge_version : neoforge_version,
            mod_version      : version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        // add your publishing repo if you need one
    }
}